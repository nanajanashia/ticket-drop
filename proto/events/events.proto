syntax="proto3";

package events;

option go_package = "github.com/nanajanashia/ticket-drop/proto/events";

message OrderConfirmed {
    string message_id = 1;
    int64 order_id = 2;
    string buyer_email = 3;
    string concert_name = 4;
    int32 quantity = 5;
    int64 amount_minor = 6;
    string currency = 7;
}